# ripgrep config for security-audit-lean (RIPGREP_CONFIG_PATH points here).
# Secrets and env files are never searched during traversal.
# NOTE: a file named explicitly on the rg command line is still searched; the
# agent rules forbid naming such files.
--glob=!**/secrets*.yaml
--glob=!**/secrets*.yml
--glob=!**/.env
--glob=!**/.env.*
--glob=!**/*.env
--glob=!**/*.pem
--glob=!**/*.key
--glob=!**/id_rsa*
--glob=!**/id_ed25519*
--glob=!.git/
--max-columns=300
--max-columns-preview
--max-filesize=2M
--no-binary
